[project]
name = "vasu-portfolio-api"
version = "1.0.0"
requires-python = ">=3.11"
# Vercel installs from this list when pyproject.toml exists (it ignores requirements.txt then).
# Docker and local installs use requirements.txt. tests/test_dependency_files.py keeps them identical.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<0.5",
    "alembic>=1.13,<2.0",
    "openai>=1.50,<3.0",
]

[tool.uv]
package = false  # an application, not an installable library: only install the dependencies

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
